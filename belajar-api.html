<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belajar API - Generator Meme</title>
    <!-- Font modern dari Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #8b5cf6;
            --primary-hover: #7c3aed;
            --bg-color: #0f172a;
            --text-color: #f8fafc;
            --card-bg: rgba(30, 41, 59, 0.7);
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            background-image:
                radial-gradient(at 0% 0%, rgba(139, 92, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(56, 189, 248, 0.15) 0px, transparent 50%);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 2.5rem;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 420px;
            width: 100%;
        }

        h1 {
            margin-top: 0;
            font-size: 1.75rem;
            background: linear-gradient(to right, #a78bfa, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        p {
            color: #94a3b8;
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 2rem;
        }

        .image-container {
            margin: 1.5rem 0;
            height: 320px;
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            background-color: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            /* Ini kuncinya! Mengubah cover menjadi contain */
            display: none;
            /* Sembunyikan sebelum gambar diload */
            transition: opacity 0.4s ease-in-out;
        }

        .loading {
            font-size: 1rem;
            color: #64748b;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        /* Animasi loading sederhana */
        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top-color: var(--primary);
            animation: spin 1s ease-in-out infinite;
            display: none;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        button {
            background: linear-gradient(135deg, var(--primary), #3b82f6);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1.05rem;
            font-weight: 600;
            font-family: 'Outfit', sans-serif;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(139, 92, 246, 0.4);
        }

        button:active {
            transform: translateY(1px);
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .kategori-dropdown {
            width: 100%;
            padding: 12px;
            margin-bottom: 1.5rem;
            border-radius: 10px;
            background-color: rgba(15, 23, 42, 0.8);
            color: white;
            border: 1px solid rgba(139, 92, 246, 0.4);
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            outline: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .kategori-dropdown:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(139, 92, 246, 0.2);
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Eksplorasi API</h1>
        <div class="image-container" id="imageBox">
            <div class="loading" id="loadingText">
                <div class="spinner" id="spinner"></div>
                <span>Belum ada gambar</span>
            </div>
            <img id="meme" alt="Gambar Anjing Acak dari API" />
        </div>

        <button id="fetchBtn">Panggil API Sekarang!</button>
    </div>

    <!-- 
      BAGIAN JAVASCRIPT
      Di sinilah kita melakukan "Request" ke API dan menangani "Response"-nya
    -->
    <script>
        const fetchBtn = document.getElementById('fetchBtn');
        const meme = document.getElementById('meme');
        const loadingText = document.getElementById('loadingText');
        const spinner = document.getElementById('spinner');

        // Fungsi asinkronus (berjalan di latar belakang) untuk mengambil data
        async function getmeme() {
            // 1. Ubah tampilan saat sedang loading
            meme.style.display = 'none';
            loadingText.style.display = 'flex';
            loadingText.querySelector('span').textContent = 'Pelayan sedang mengambil data...';
            spinner.style.display = 'block';

            fetchBtn.disabled = true;
            fetchBtn.textContent = 'Mohon tunggu...';

            try {
                // 2. MENGIRIM REQUEST KE API MEME
                const apiUrl = 'https://meme-api.com/gimme';
                const response = await fetch(apiUrl);

                // 3. MENERIMA RESPONSE DAN MENGUBAHNYA MENJADI JSON
                // JSON adalah format data yang mudah dipahami JavaScript
                const data = await response.json();

                /* 
                   Data JSON yang kita dapatkan bentuknya seperti ini:
                   {
                     "message": "https://images.dog.ceo/breeds/husky/n02110185_10047.jpg",
                     "status": "success"
                   }
                */

                // 4. MENGGUNAKAN DATA UNTUK MENGUBAH TAMPILAN
                // Kita ambil properti "message" yang berisi link gambar
                meme.src = data.url;

                // Tunggu sampai gambar benar-benar termuat sebelum ditampilkan
                meme.onload = () => {
                    loadingText.style.display = 'none';
                    meme.style.display = 'block';
                    spinner.style.display = 'none';
                };

            } catch (error) {
                // 5. JIKA TERJADI ERROR (misal tidak ada koneksi internet)
                loadingText.querySelector('span').textContent = 'Gagal memanggil API 😢';
                spinner.style.display = 'none';
            } finally {
                // 6. KEMBALIKAN TOMBOL SEPERTI SEMULA
                fetchBtn.disabled = false;
                fetchBtn.textContent = 'Panggil API Lagi!';
            }
        }

        // Memberikan perintah: jika tombol diklik, jalankan fungsi getDogImage
        fetchBtn.addEventListener('click', getmeme);
    </script>

</body>

</html>
